<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>いろ検クエスト</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow column, like a pocket colour-chip book; screens swap in place. Signature motif = the 24-hue PCCS strip. */
:root {
  --paper: #F3F4F7;
  --card: #FFFFFF;
  --ink: #1A1C26;
  --muted: #5E6374;
  --line: #DADDE6;
  --accent: #2C3E9E;
  --accent-ink: #FFFFFF;
  --ok: #0B8A57;
  --ok-bg: #E2F5EC;
  --ng: #C93434;
  --ng-bg: #FBE6E6;
  --chip-edge: rgba(26, 28, 38, .12);
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12141B; --card: #1C1F2A; --ink: #ECEEF4; --muted: #A2A7B8; --line: #2E3242;
    --accent: #93A5FF; --accent-ink: #12141B; --ok: #43CF92; --ok-bg: #143327; --ng: #FF7A7A; --ng-bg: #3A1A1D;
    --chip-edge: rgba(255, 255, 255, .14); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12141B; --card: #1C1F2A; --ink: #ECEEF4; --muted: #A2A7B8; --line: #2E3242;
  --accent: #93A5FF; --accent-ink: #12141B; --ok: #43CF92; --ok-bg: #143327; --ng: #FF7A7A; --ng-bg: #3A1A1D;
  --chip-edge: rgba(255, 255, 255, .14); color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

.app {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 40px;
}
.strip { display: grid; grid-template-columns: repeat(24, 1fr); height: 10px; border-radius: 5px; overflow: hidden; }
.strip span { display: block; }

/* ---------- home ---------- */
.hero { display: grid; gap: 14px; padding-block: 18px 22px; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; }
.logo { font-family: var(--font-display); font-weight: 400; font-size: clamp(38px, 11vw, 54px); line-height: 1.05; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.logo .dot { display: inline-block; width: .5em; height: .5em; border-radius: 3px; vertical-align: .12em; margin-left: .08em; background: #E60033; transition: background .6s; }
.lede { margin: 0; color: var(--muted); font-size: 15px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat b { display: block; font-family: var(--font-mono); font-size: 20px; font-variant-numeric: tabular-nums; }
.stat small { color: var(--muted); font-size: 12px; }

.section-h { font-family: var(--font-display); font-weight: 400; font-size: 18px; margin: 26px 0 10px; }
.modes { display: grid; gap: 10px; }
.mode {
  display: grid; grid-template-columns: 56px 1fr auto; gap: 14px; align-items: center;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--r);
  padding: 12px 14px; transition: transform .12s, border-color .12s;
}
.mode:hover { border-color: var(--accent); }
.mode:active { transform: scale(.98); }
.mode-swatch { width: 56px; height: 56px; border-radius: 10px; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; border: 1px solid var(--chip-edge); }
.mode-swatch span { display: block; }
.mode h3 { margin: 0; font-size: 17px; font-weight: 700; }
.mode p { margin: 2px 0 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.mode .best { font-family: var(--font-mono); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; }
.mode .best b { display: block; font-size: 16px; color: var(--ink); }
.mode.featured { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.mode.featured p, .mode.featured .best, .mode.featured .best b { color: var(--accent-ink); opacity: .9; }

.learn-btn {
  margin-top: 10px; width: 100%; cursor: pointer; padding: 14px; border-radius: var(--r);
  background: transparent; border: 1.5px dashed var(--line); font-weight: 700; color: var(--ink);
}
.learn-btn:hover { border-color: var(--accent); }
.foot { margin-top: 26px; font-size: 12px; color: var(--muted); line-height: 1.6; }
.toggles { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.pill { cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; }

/* ---------- quiz ---------- */
.topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--paper); padding-block: 8px; z-index: 5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.icon-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); cursor: pointer; font-size: 18px; line-height: 1; flex: none; }
.progress { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.progress i { height: 8px; border-radius: 4px; background: var(--line); }
.progress i.ok { background: var(--ok); }
.progress i.ng { background: var(--ng); }
.progress i.now { background: var(--accent); }
.score { font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; position: relative; }
.pop { position: absolute; right: 0; top: -6px; font-size: 13px; color: var(--ok); animation: pop .9s ease-out forwards; pointer-events: none; white-space: nowrap; }
@keyframes pop { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-22px); } }

.qmeta { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; font-size: 12px; color: var(--muted); font-family: var(--font-mono); }
.combo { color: var(--accent); font-weight: 600; }
.qcard { margin-top: 8px; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 16px; }
.qtag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--paper); color: var(--muted); }
.qtext { font-size: 18px; font-weight: 700; margin: 10px 0 0; line-height: 1.5; text-wrap: pretty; }
.visual { margin-top: 14px; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
.chip { border-radius: 12px; border: 1px solid var(--chip-edge); }
.chip.big { width: min(200px, 60vw); aspect-ratio: 1; max-width: 100%; }
.chip.mid { width: 72px; height: 72px; }
.chip-col { display: grid; gap: 4px; justify-items: center; font-family: var(--font-mono); font-size: 12px; color: var(--muted); }
.tone-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; }
.tone-row .chip { aspect-ratio: 1; width: 100%; }
.notation { font-family: var(--font-mono); font-size: 26px; font-weight: 600; text-align: center; letter-spacing: .04em; }

.choices { display: grid; gap: 10px; margin-top: 14px; }
.choices.swatches { grid-template-columns: 1fr 1fr; }
.choice {
  cursor: pointer; text-align: left; width: 100%;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 13px 14px; font-size: 16px; font-weight: 500; line-height: 1.4;
  display: flex; gap: 10px; align-items: center; transition: transform .1s, border-color .12s, background .12s;
}
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice:active:not(:disabled) { transform: scale(.98); }
.choice:disabled { cursor: default; }
.choice .k { font-family: var(--font-mono); font-size: 12px; color: var(--muted); width: 18px; flex: none; }
.choice.sw { display: grid; padding: 8px; gap: 6px; }
.choice.sw .chip { width: 100%; aspect-ratio: 1.6; }
.choice.sw .cap { font-size: 13px; min-height: 1.4em; text-align: center; color: var(--muted); }
.choice.right { border-color: var(--ok); background: var(--ok-bg); }
.choice.wrong { border-color: var(--ng); background: var(--ng-bg); }
.choice.dim { opacity: .55; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

.feedback { margin-top: 14px; border-radius: var(--r); padding: 14px 16px; border: 1.5px solid; }
.feedback.ok { border-color: var(--ok); background: var(--ok-bg); }
.feedback.ng { border-color: var(--ng); background: var(--ng-bg); }
.feedback h4 { margin: 0 0 4px; font-size: 16px; }
.feedback.ok h4 { color: var(--ok); }
.feedback.ng h4 { color: var(--ng); }
.feedback p { margin: 0; font-size: 14.5px; }
.feedback .mini { display: inline-block; width: 1em; height: 1em; border-radius: 3px; vertical-align: -.15em; border: 1px solid var(--chip-edge); margin: 0 2px; }
.primary {
  margin-top: 12px; width: 100%; cursor: pointer; border: 0; border-radius: 12px; padding: 14px;
  background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 16px;
}
.primary:active { transform: scale(.98); }
.ghost { margin-top: 10px; width: 100%; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 13px; font-weight: 700; }

/* ---------- result ---------- */
.result { text-align: center; padding-top: 18px; }
.result .big { font-family: var(--font-display); font-size: 64px; line-height: 1; margin: 12px 0 4px; font-variant-numeric: tabular-nums; }
.result .rank { font-weight: 700; font-size: 20px; margin: 4px 0; }
.result .sub { color: var(--muted); font-size: 14px; margin: 0; }
.result-chips { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; margin: 20px 0 6px; }
.result-chips i { aspect-ratio: 1; border-radius: 6px; display: grid; place-items: center; font-style: normal; font-size: 12px; font-weight: 700; color: #fff; }
.review { text-align: left; margin-top: 18px; display: grid; gap: 8px; }
.review-item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.review-item b { color: var(--ng); }

/* ---------- learn ---------- */
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-top: 12px; scrollbar-width: none; }
.tab { flex: none; cursor: pointer; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; font-size: 14px; font-weight: 700; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.panel { margin-top: 14px; }
.panel h3 { font-size: 16px; margin: 18px 0 6px; }
.panel p { margin: 6px 0; font-size: 14.5px; }
.hue-pick { display: grid; grid-template-columns: repeat(12, 1fr); gap: 4px; margin: 8px 0 12px; }
.hue-pick button { aspect-ratio: 1; border-radius: 6px; border: 2px solid transparent; cursor: pointer; padding: 0; }
.hue-pick button[aria-pressed="true"] { border-color: var(--ink); }
.tonemap { display: grid; grid-template-columns: 24px repeat(4, 1fr); grid-template-rows: repeat(8, 30px); gap: 4px; }
.tonemap .t { border-radius: 8px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 600; border: 1px solid var(--chip-edge); cursor: pointer; padding: 0; }
.tonemap .axis { writing-mode: vertical-rl; font-size: 11px; color: var(--muted); display: grid; place-items: center; }
.tonemap-x { display: grid; grid-template-columns: 24px 1fr; font-size: 11px; color: var(--muted); margin-top: 4px; }
.tone-info { margin-top: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14px; min-height: 64px; }
.wheel-wrap { display: grid; place-items: center; }
.wheel-wrap svg { width: min(340px, 100%); height: auto; }
.wheel-wrap text { font-family: var(--font-mono); font-size: 9px; fill: var(--ink); }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 12px; color: var(--muted); font-weight: 500; }
.names { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.name-card { display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; }
.name-card .chip { width: 40px; height: 40px; border-radius: 8px; }
.name-card b { font-size: 14px; display: block; line-height: 1.3; }
.name-card small { color: var(--muted); font-size: 11px; font-family: var(--font-mono); }
.mixbox { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 10px 0; }
.mixbox svg { width: 150px; height: 140px; }
.mixbox figcaption { text-align: center; font-size: 13px; font-weight: 700; }

/* ---------- action arena ---------- */
/* The arena is a fixed neutral grey on purpose: colours are judged on a neutral mid-grey ground (N5 相当), so it does not change with the theme. */
:root { --arena: #6E7075; --arena-ink: #FFFFFF; --arena-panel: rgba(0, 0, 0, .2); --arena-soft: rgba(255, 255, 255, .14); }
.mode.action { background: var(--arena); color: var(--arena-ink); border-color: transparent; }
.mode.action p { color: rgba(255, 255, 255, .86); }
.mode.action .best, .mode.action .best b { color: var(--arena-ink); }
.mode.action .badge { font-family: var(--font-mono); font-size: 10px; letter-spacing: .12em; background: var(--arena-ink); color: var(--arena); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
.arena {
  position: fixed; inset: 0; z-index: 20; display: flex; flex-direction: column;
  background: var(--arena); color: var(--arena-ink); user-select: none; -webkit-user-select: none; touch-action: manipulation;
  padding-top: calc(env(safe-area-inset-top, 0px) + 8px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.arena > * { width: 100%; max-width: 560px; margin-inline: auto; }
.hud { display: grid; grid-template-columns: 40px 1fr 1fr auto; gap: 12px; align-items: center; }
.hud-btn { background: var(--arena-panel); border: 0; color: var(--arena-ink); }
.hud-stat small { display: block; font-family: var(--font-mono); font-size: 10px; letter-spacing: .14em; opacity: .75; line-height: 1; }
.hud-stat b { font-family: var(--font-mono); font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.hud-lives { display: flex; gap: 5px; }
.hud-lives i { width: 18px; height: 18px; border-radius: 5px; transition: background .2s, transform .2s; }
.rule { margin: 10px auto; padding: 10px 14px; border-radius: 14px; background: var(--arena-panel); min-height: 64px; }
.rule b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 22px; line-height: 1.3; }
.rule small { font-size: 13px; opacity: .88; }
.rule.flash { animation: flash .5s; }
@keyframes flash { 0% { background: rgba(255, 255, 255, .7); transform: scale(1.04); } 100% { background: var(--arena-panel); transform: scale(1); } }
.field { flex: 1; position: relative; overflow: hidden; border-radius: 18px; background: rgba(0, 0, 0, .08); touch-action: none; min-height: 0; }
.fchip { position: absolute; left: 0; top: 0; border-radius: 14px; box-shadow: 0 6px 14px rgba(0, 0, 0, .28); will-change: transform; cursor: pointer; }
.fchip.gone { transition: opacity .25s, transform .25s; opacity: 0; }
.combo-big { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 150px); transform: translateX(-50%); font-family: var(--font-display); font-size: 26px; white-space: nowrap; text-shadow: 0 3px 10px rgba(0, 0, 0, .35); pointer-events: none; z-index: 3; }
.combo-big.pulse { animation: pulse .35s; }
@keyframes pulse { 0% { transform: translateX(-50%) scale(1.5); } 100% { transform: translateX(-50%) scale(1); } }
.countdown { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-size: 96px; background: rgba(0, 0, 0, .28); z-index: 5; text-shadow: 0 6px 20px rgba(0, 0, 0, .35); }
.countdown.cd { animation: cd .55s ease-out; }
@keyframes cd { 0% { font-size: 150px; opacity: 0; } 30% { opacity: 1; } 100% { font-size: 96px; } }
.shake-big { animation: shakeBig .35s; }
@keyframes shakeBig { 15% { transform: translate(-8px, 3px); } 35% { transform: translate(7px, -4px); } 55% { transform: translate(-5px, 2px); } 75% { transform: translate(3px, -1px); } }
.ftext { position: fixed; z-index: 61; transform: translate(-50%, -50%); font-family: var(--font-display); font-size: 24px; color: #FFFFFF; text-shadow: 0 2px 8px rgba(0, 0, 0, .55); pointer-events: none; text-align: center; line-height: 1.1; animation: rise .9s ease-out forwards; white-space: nowrap; }
.ftext small { display: block; font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.ftext.bad { color: #FFD6D6; }
@keyframes rise { 0% { opacity: 0; margin-top: 10px; } 15% { opacity: 1; } 100% { opacity: 0; margin-top: -50px; } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 60; }

.field-map { display: flex; flex-direction: column; gap: 12px; background: transparent; }
.map-top { display: flex; gap: 14px; align-items: center; }
.target { width: 96px; height: 96px; flex: none; border-radius: 18px; box-shadow: 0 8px 18px rgba(0, 0, 0, .3); transition: background .15s; }
.map-side { flex: 1; display: grid; gap: 8px; font-size: 13px; }
.tbar { height: 12px; background: rgba(0, 0, 0, .25); border-radius: 6px; overflow: hidden; }
.tbar i { display: block; height: 100%; width: 100%; background: #FFFFFF; border-radius: 6px; }
.tbar i.low { background: #FFB3B3; }
.mapgrid { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(8, minmax(26px, 1fr)); gap: 6px; min-height: 0; }
.mcell { border-radius: 10px; border: 1.5px solid rgba(255, 255, 255, .3); background: var(--arena-soft); color: var(--arena-ink); cursor: pointer; display: grid; place-content: center; gap: 0; padding: 2px; line-height: 1.15; transition: background .15s, transform .1s; }
.mcell:active { transform: scale(.96); }
.mcell b { font-family: var(--font-mono); font-size: 16px; }
.mcell small { font-size: 10px; opacity: .85; }
.mcell.wrongc { border-color: #FFB3B3; background: rgba(201, 52, 52, .55); }
.mcell.reveal { border-color: #FFFFFF; border-width: 3px; }
.field-wheel { display: grid; place-items: center; background: transparent; }
.field-wheel svg { width: 100%; height: 100%; max-width: 100%; touch-action: none; }
.field-wheel text { font-family: var(--font-mono); font-size: 10px; font-weight: 600; pointer-events: none; }
.seg { stroke: var(--arena); stroke-width: 1; }
.seg.ans { stroke: #FFFFFF; stroke-width: 5; }
.seg.miss { stroke: #1A1C26; stroke-width: 5; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="app">

  <!-- HOME -->
  <section id="home">
    <div class="strip" id="strip-top" aria-hidden="true"></div>
    <div class="hero">
      <span class="eyebrow">色彩検定 3級・2級レベル</span>
      <h1 class="logo">いろ検<br>クエスト<span class="dot" id="logo-dot"></span></h1>
      <p class="lede">10問1セット。色を見て、選んで、解説を読む。トーン・色相環・慣用色名・配色技法をスマホでサクッと覚えよう。</p>
      <div class="stats">
        <div class="stat"><b id="st-total">0</b><small>解いた問題</small></div>
        <div class="stat"><b id="st-rate">–</b><small>正答率</small></div>
        <div class="stat"><b id="st-streak">0</b><small>最高コンボ</small></div>
      </div>
    </div>

    <h2 class="section-h">アクション</h2>
    <div class="modes" id="act-modes"></div>
    <p class="foot" style="margin-top:8px">アクションのフィールドは、色を見比べやすい中性グレー（N5相当）の背景です。</p>

    <h2 class="section-h">クイズ</h2>
    <div class="modes" id="modes"></div>
    <button class="learn-btn" id="go-learn" type="button">まなぶ ― トーン図・色相環・慣用色名図鑑を見る</button>

const MODES = [
  { id: "mix",   title: "ミックス10問",  desc: "全ジャンルからランダム。まずはここから。", featured: true, sw: ["#E60033", "#FFE600", "#00A14B", "#0059A8"] },

/* ================= color utils ================= */
const hex2rgb = h => { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; };
const rgb2hex = c => "#" + c.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("").toUpperCase();
const mix = (a, b, w) => { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex(A.map((v, i) => v * w + B[i] * (1 - w))); };
const dist = (a, b) => { const A = hex2rgb(a), B = hex2rgb(b); return Math.hypot(...A.map((v, i) => (v - B[i]) * [0.3, 0.59, 0.11][i] * 3)); };
const toneColor = (tone, hue) => tone === "v" ? HUES[hue].hex : mix(HUES[hue].hex, TONES[tone].mix[1], TONES[tone].mix[0]);
const lum = h => { const [r, g, b] = hex2rgb(h); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
const textOn = h => lum(h) > 0.6 ? "#1A1C26" : "#FFFFFF";

/* ================= helpers ================= */
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const pick = a => a[rnd(a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const wrap24 = n => ((n - 1) % 24 + 24) % 24 + 1;
const hueDiff = (a, b) => { const d = Math.abs(a - b); return Math.min(d, 24 - d); };
const chip = (hex, cls = "mid", label = "") => `<span class="chip ${cls}" style="background:${hex}" role="img" aria-label="${label || "色見本"}"></span>`;
const mini = hex => `<span class="mini" style="background:${hex}"></span>`;
const toneLabel = k => `${k}（${TONES[k].en}／${TONES[k].jp}）`;
const hueLabel = n => `${n}:${HUES[n].sym}（${HUES[n].name}）`;

const store = {
  get(k, d) { try { const v = localStorage.getItem("irokenq:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("irokenq:" + k, JSON.stringify(v)); } catch {} },
};

/* ================= sound ================= */
let soundOn = store.get("sound", true);
let actx = null;
function beep(ok) {
  if (!soundOn) return;
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const notes = ok ? [660, 990] : [220, 180];
    notes.forEach((f, i) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? "triangle" : "square"; o.frequency.value = f;
      const t = actx.currentTime + i * 0.09;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(ok ? 0.18 : 0.06, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g).connect(actx.destination); o.start(t); o.stop(t + 0.18);
    });
  } catch {}
}

/* ================= question generators ================= */
function qKnow() {
  const [tag, q, opts, exp] = pick(KNOW);
  return { tag, text: q, visual: "", choices: shuffle(opts.map((o, i) => ({ html: o, correct: i === 0 }))), explain: exp, key: "k:" + q, short: q };
}

function qTone() {
  const t = pick(TONE_KEYS);
  const start = rnd(6) + 1;
  const hues = [start, start + 6, start + 12, start + 18].map(wrap24);
  const near = TONE_KEYS.filter(k => k !== t)
    .map(k => ({ k, d: Math.abs(TONES[k].col - TONES[t].col) * 1.3 + Math.abs(TONES[k].row - TONES[t].row) + Math.random() * 0.8 }))
    .sort((a, b) => a.d - b.d).slice(0, 3).map(o => o.k);
  const visual = `<div class="tone-row">${hues.map(h => chip(toneColor(t, h), "", `${t}${h}`)).join("")}</div>`;
  return {
    tag: "PCCSトーン",
    text: "この4色に共通するトーンはどれ？",
    visual,
    choices: shuffle([t, ...near].map(k => ({ html: `<span class="k">${k}</span>${TONES[k].en}（${TONES[k].jp}）`, correct: k === t }))),
    explain: `正解は <b>${toneLabel(t)}</b>。${TONES[t].kind}のトーンです。左から ${hues.map(h => `${t}${h}`).join("・")}。同じトーンなら色相が違っても「明るさ・鮮やかさの調子」がそろって見えます。`,
    key: "t:" + t, short: `トーン ${t}`,
  };
}

function qHue() {
  const kind = pick(["comp", "comp", "name", "diff", "diff", "sym"]);
  const n = rnd(24) + 1;
  if (kind === "comp") {
    const ans = wrap24(n + 12);
    const offs = shuffle([2, -2, 3, -3, 6, -6]).slice(0, 3);
    const opts = [ans, ...offs.map(o => wrap24(ans + o))];
    return {
      tag: "補色", text: "この色の<b>補色</b>（PCCS色相環で正反対の色）はどれ？",
      visual: `<div class="chip-col">${chip(HUES[n].hex, "big", hueLabel(n))}</div>`,
      swatch: true,
      choices: shuffle(opts.map(h => ({ html: chip(HUES[h].hex, "", "選択肢"), cap: hueLabel(h), correct: h === ans }))),
      explain: `${mini(HUES[n].hex)}${hueLabel(n)} の補色は ${mini(HUES[ans].hex)}<b>${hueLabel(ans)}</b>。PCCSでは色相番号に12を足し引きした色が心理補色です。`,
      key: "h:comp" + n, short: `${n}:${HUES[n].sym} の補色`,
    };
  }
  if (kind === "name") {
    const pool = shuffle([-1, 1, -2, 2, -3, 3, -4, 4].map(o => wrap24(n + o)));
    const names = [HUES[n].name];
    for (const h of pool) { if (names.length >= 4) break; if (!names.includes(HUES[h].name)) names.push(HUES[h].name); }
    return {
      tag: "色相", text: "この色の色相名はどれ？（PCCS v トーン）",
      visual: `<div class="chip-col">${chip(HUES[n].hex, "big", "色見本")}</div>`,
      choices: shuffle(names.map(nm => ({ html: nm, correct: nm === HUES[n].name }))),
      explain: `${mini(HUES[n].hex)} は PCCS 色相番号 <b>${hueLabel(n)}</b>。「〜みの」は修飾語で、たとえば「黄みの赤」は黄に寄った赤のことです。`,
      key: "h:name" + n, short: `${n}:${HUES[n].sym} の色相名`,
    };
  }
  if (kind === "diff") {
    const cats = [
      { name: "同一色相配色", r: [0, 0] }, { name: "隣接色相配色", r: [1, 1] }, { name: "類似色相配色", r: [2, 3] },
      { name: "中差色相配色", r: [4, 7] }, { name: "対照色相配色", r: [8, 10] }, { name: "補色色相配色", r: [11, 12] },
    ];
    const ci = rnd(5) + 1; // skip 同一 most of the time
    const c = cats[ci];
    const d = c.r[0] + rnd(c.r[1] - c.r[0] + 1);
    const m = wrap24(n + (Math.random() < .5 ? d : -d));
    const wrong = shuffle(cats.filter((_, i) => i !== ci)).slice(0, 3);
    return {
      tag: "色相配色", text: "この2色の配色は、色相差で分けると何？",
      visual: `<div class="chip-col">${chip(HUES[n].hex, "mid")}<span>${n}:${HUES[n].sym}</span></div><div class="chip-col">${chip(HUES[m].hex, "mid")}<span>${m}:${HUES[m].sym}</span></div>`,
      choices: shuffle([c, ...wrong].map(x => ({ html: x.name, correct: x === c }))),
      explain: `色相番号 ${n} と ${m} の差は <b>${hueDiff(n, m)}</b> なので <b>${c.name}</b>。目安：0 同一／1 隣接／2〜3 類似／4〜7 中差／8〜10 対照／11〜12 補色。`,
      key: "h:diff" + ci, short: `色相差 ${hueDiff(n, m)}`,
    };
  }
  // sym
  const ans = HUES[n].sym;
  const syms = [ans];
  for (const h of shuffle([-1, 1, -2, 2, -3, 3, 6, -6].map(o => wrap24(n + o)))) { if (syms.length >= 4) break; if (!syms.includes(HUES[h].sym)) syms.push(HUES[h].sym); }
  return {
    tag: "色相記号", text: `PCCS 色相番号 <b>${n}</b> の色相記号はどれ？`,
    visual: `<div class="notation">${n} : ?</div>`,
    choices: shuffle(syms.map(s => ({ html: `<span style="font-family:var(--font-mono);font-weight:600">${s}</span>`, correct: s === ans }))),
    explain: `${mini(HUES[n].hex)} ${n} は <b>${ans}</b>（${HUES[n].name}）。大文字が基本の色、小文字の前置きは「〜みの」を表します（例：yR＝黄みの赤）。2:R・8:Y・12:G・18:B が心理四原色。`,
    key: "h:sym" + n, short: `色相番号 ${n} の記号`,
  };
}

function qName() {
  const c = pick(NAMES);
  const near = NAMES.filter(x => x !== c).map(x => ({ x, d: dist(x.hex, c.hex) })).sort((a, b) => a.d - b.d).slice(0, 7);
  const others = shuffle(near).slice(0, 3).map(o => o.x);
  const opts = shuffle([c, ...others]);
  const exp = `${mini(c.hex)} <b>${c.name}</b>（${c.yomi}）― ${c.note}`;
  if (Math.random() < 0.5) {
    return {
      tag: "慣用色名", text: "この色の慣用色名はどれ？",
      visual: `<div class="chip-col">${chip(c.hex, "big", "色見本")}</div>`,
      choices: opts.map(o => ({ html: o.name, correct: o === c, extra: o })),
      explain: exp, key: "n:" + c.name, short: c.name,
    };
  }
  return {
    tag: "慣用色名", text: `「<b>${c.name}</b>」はどの色？`,
    visual: `<div style="font-size:13px;color:var(--muted)">${c.yomi}</div>`,
    swatch: true,
    choices: opts.map(o => ({ html: chip(o.hex, "", "選択肢"), cap: o.name, correct: o === c })),
    explain: exp, key: "n:" + c.name, short: c.name,
  };
}

const GEN = { know: qKnow, tone: qTone, hue: qHue, names: qName };
function makeSet(mode) {
  const out = [], keys = new Set();
  let guard = 0;
  while (out.length < 10 && guard++ < 200) {
    const g = mode === "mix" ? GEN[pick(["know", "know", "tone", "hue", "names"])] : GEN[mode];
    const q = g();
    if (keys.has(q.key) && guard < 150) continue;
    keys.add(q.key); out.push(q);
  }
  return out;
}

}
let lastKind = "quiz", lastAct = "rush";

      <span class="mode-swatch" aria-hidden="true">${sw.map(c => `<span style="background:${c}"></span>`).join("")}</span>

      <span class="best">ベスト<b>${b ? b.score : "—"}</b></span></button>`;
  }).join("");
}

function start(mode) {
  lastKind = "quiz";
  S = { mode, qs: makeSet(mode), i: 0, score: 0, combo: 0, maxCombo: 0, results: [], t0: 0 };
  $("#progress").innerHTML = "<i></i>".repeat(10);
  show("quiz");
  renderQ();
}

function renderQ() {
  const q = S.qs[S.i];
  [...$("#progress").children].forEach((el, i) => {
    el.className = i < S.i ? (S.results[i].ok ? "ok" : "ng") : i === S.i ? "now" : "";
  });
  $("#qnum").textContent = `Q${S.i + 1} / 10`;
  $("#combo").textContent = S.combo >= 2 ? `${S.combo} COMBO` : "";
  $("#score").textContent = S.score;
  $("#qtag").textContent = q.tag;
  $("#qtext").innerHTML = q.text;
  $("#visual").innerHTML = q.visual;
  const box = $("#choices");
  box.className = "choices" + (q.swatch ? " swatches" : "");
  box.innerHTML = q.choices.map((c, i) => q.swatch
    ? `<button class="choice sw" type="button" data-i="${i}">${c.html}<span class="cap"></span></button>`
    : `<button class="choice" type="button" data-i="${i}">${c.html.includes('class="k"') ? c.html : `<span class="k">${"ABCD"[i]}</span>${c.html}`}</button>`
  ).join("");
  $("#feedback").hidden = true;
  $("#next").hidden = true;
  S.t0 = performance.now();
  S.locked = false;
}

function answer(idx) {
  if (S.locked) return;
  S.locked = true;
  const q = S.qs[S.i];
  const ok = q.choices[idx].correct;
  const secs = (performance.now() - S.t0) / 1000;
  const btns = [...$("#choices").children];
  btns.forEach((b, i) => {
    b.disabled = true;
    if (q.choices[i].correct) b.classList.add("right");
    else if (i === idx) b.classList.add("wrong");
    else b.classList.add("dim");
    if (q.swatch) b.querySelector(".cap").textContent = q.choices[i].cap;
  });
  let gained = 0;
  if (ok) {
    S.combo++; S.maxCombo = Math.max(S.maxCombo, S.combo);
    const speed = Math.max(0, Math.round(50 - secs * 5));
    const comboB = Math.min(100, (S.combo - 1) * 20);
    gained = 100 + speed + comboB;
    S.score += gained;
    const sc = $("#score");
    sc.textContent = S.score;
    const p = document.createElement("span"); p.className = "pop"; p.textContent = "+" + gained;
    sc.appendChild(p); setTimeout(() => p.remove(), 900);
    const rb = btns[idx], swc = rb.querySelector(".chip");
    const [bx, by] = centerOf(rb);
    burst(bx, by, swc ? swc.style.background : HUES[rnd(24) + 1].hex, 12 + Math.min(16, S.combo * 2));
  } else {
    S.combo = 0;
    btns[idx].classList.add("shake");
    try { navigator.vibrate && navigator.vibrate(60); } catch {}
  }
  beep(ok);
  $("#combo").textContent = S.combo >= 2 ? `${S.combo} COMBO` : "";
  S.results.push({ ok, q });
  const fb = $("#feedback");
  fb.className = "feedback " + (ok ? "ok" : "ng");
  $("#fb-title").textContent = ok ? (S.combo >= 3 ? `正解！ ${S.combo}コンボ` : "正解！") : "ざんねん…";
  $("#fb-body").innerHTML = q.explain;
  fb.hidden = false;
  const nx = $("#next");
  nx.textContent = S.i === 9 ? "結果を見る" : "次の問題へ";
  nx.hidden = false;
  requestAnimationFrame(() => nx.scrollIntoView({ behavior: "smooth", block: "nearest" }));
}

function next() {
  if (S.i < 9) { S.i++; renderQ(); window.scrollTo({ top: 0, behavior: "smooth" }); }
  else finish();
}

    const a = Math.random() * Math.PI * 2, s = 120 + Math.random() * 280;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 80, life: 1, c: color, r: 3 + Math.random() * 5, sq: Math.random() < .5 });

  $("#res-rank").textContent = ACT_RANKS.find(r => a.score >= r[0])[1];
  const acc = a.hits + a.misses ? Math.round(a.hits / (a.hits + a.misses) * 100) : 0;
  $("#res-sub").innerHTML = `ヒット ${a.hits}・ミス ${a.misses}（${acc}%）・最大 ${a.maxCombo} コンボ${a.def.extra ? "・" + a.def.extra(a) : ""}${isBest ? "・<b>ベスト更新！</b>" : ""}<br>${a.caught.length ? "今回つかまえた色" : ""}`;
  $("#res-chips").innerHTML = a.caught.slice(-20).map(c => `<i style="background:${c}"></i>`).join("");
  $("#review").innerHTML = a.mistakes.length
    ? `<h2 class="section-h" style="margin:8px 0 0">見直しポイント</h2>` + a.mistakes.slice(-8).map(m => `<div class="review-item">${mini(m.hex)} ${m.text}<br><small style="color:var(--muted)">${m.why}</small></div>`).join("")
    : "";
  renderHome();
  show("result");
}

/* ---- カラーラッシュ ---- */
const VIVIDISH = ["v", "b", "s", "dp", "lt"];
const RUSH_RULES = [
  { label: "暖色をタップ！", hint: "暖色＝色相 1〜8（赤〜黄）", short: "暖色", test: c => c.h <= 8, tones: VIVIDISH },
  { label: "寒色をタップ！", hint: "寒色＝色相 13〜19（青緑〜青）", short: "寒色", test: c => c.h >= 13 && c.h <= 19, tones: VIVIDISH },
  { label: "中性色をタップ！", hint: "中性色＝緑系 9〜12 と 紫系 20〜24", short: "中性色", test: c => (c.h >= 9 && c.h <= 12) || c.h >= 20, tones: ["v", "b", "s", "dp"] },
  { label: "純色（v）をタップ！", hint: "その色相でいちばん鮮やかな色", short: "純色 v", test: c => c.t === "v" },
  { label: "明清色をタップ！", hint: "純色＋白 → p・lt・b", short: "明清色", test: c => ["p", "lt", "b"].includes(c.t) },
  { label: "暗清色をタップ！", hint: "純色＋黒 → dp・dk", short: "暗清色", test: c => ["dp", "dk"].includes(c.t) },
  { label: "グレイッシュをタップ！", hint: "灰みの濁色 → ltg・g・dkg", short: "グレイッシュ系", test: c => ["ltg", "g", "dkg"].includes(c.t) },
  { label: "p（ペール）をタップ！", hint: "白をたっぷり含む、うすい色", short: "p トーン", test: c => c.t === "p" },
  { label: "dk（ダーク）をタップ！", hint: "純色＋黒の暗い色。dkg より色みが残る", short: "dk トーン", test: c => c.t === "dk" },
  { label: "sf（ソフト）をタップ！", hint: "明るい灰が混ざった、柔らかい色", short: "sf トーン", test: c => c.t === "sf" },
];
function rushChip(rule, want) {
  for (let i = 0; i < 80; i++) {
    const c = { h: rnd(24) + 1, t: pick(rule.tones || TONE_KEYS) };
    if (rule.test(c) === want) return c;
  }
  return { h: 2, t: "v" };
}
function rushRule(A) {
  if (!A.queue.length) A.queue = shuffle(RUSH_RULES.slice(2));
  A.rule = A.queue.shift();
  A.ruleT = 9; A.spawnT = .35; A.ruleNo++;
  A.chips.forEach(c => { c.el.classList.add("gone"); setTimeout(() => c.el.remove(), 260); });
  A.chips = [];
  setRule(A.rule.label, A.rule.hint);
}
const ACT = {
  rush: {
    setup(A) { A.chips = []; A.dur = 60; A.ruleNo = 0; A.queue = [RUSH_RULES[0], RUSH_RULES[1]]; rushRule(A); },
    hud: A => ["TIME", Math.max(0, Math.ceil(A.dur - A.t))],
    extra: A => `ルール ${A.ruleNo} 種`,
    update(A, dt) {
      const W = field.clientWidth, H = field.clientHeight, prog = Math.min(1, A.t / A.dur);
      A.ruleT -= dt; if (A.ruleT <= 0) rushRule(A);
      A.spawnT -= dt;
      if (A.spawnT <= 0) {
        A.spawnT = .9 - .45 * prog;
        const c = rushChip(A.rule, Math.random() < .45);
        const size = W < 380 ? 58 : 66;
        const el = document.createElement("div");
        el.className = "fchip"; el.style.width = el.style.height = size + "px";
        c.hex = toneColor(c.t, c.h); el.style.background = c.hex;
        Object.assign(c, { el, size, x: 8 + Math.random() * Math.max(1, W - size - 16), y: -size, v: (85 + 150 * prog) * (.8 + Math.random() * .4), ok: A.rule.test(c), rule: A.rule, sway: Math.random() * 6 });
        el._c = c; field.appendChild(el); A.chips.push(c);
      }
      A.chips = A.chips.filter(c => {
        c.y += c.v * dt;
        const x = c.x + Math.sin(A.t * 2 + c.sway) * 6;
        c.el.style.transform = `translate(${x}px, ${c.y}px)`;
        if (c.y > H) {
          c.el.remove();
          if (c.ok) { A.combo = 0; showCombo(); const r = field.getBoundingClientRect(); floatText(r.left + x + c.size / 2, r.bottom - 24, "MISS", "bad"); }
          return false;
        }
        return true;
      });
      if (A.t >= A.dur) { A.running = false; endAction(); }
    },
    tap(A, e) {
      const el = e.target.closest(".fchip"); if (!el) return;
      const c = el._c; if (!c || c.hit) return;
      c.hit = true;
      const [x, y] = centerOf(el);
      el.remove(); A.chips = A.chips.filter(o => o !== c);
      const tag = `${c.t}${c.h}`;
      if (c.ok) good(x, y, c.hex, tag, 10);
      else bad(x, y, `× ${tag}`, { hex: c.hex, text: `${tag}（${TONES[c.t].jp}・${HUES[c.h].name}）は「${c.rule.short}」ではない`, why: c.rule.hint });
    },
  },

  /* ---- トーンマップ・ダッシュ ---- */
  map: {
    setup(A) {
      field.innerHTML = `<div class="map-top"><div class="target" id="m-target"></div>
        <div class="map-side"><span id="m-info">この色のトーンはどこ？</span><div class="tbar"><i id="m-bar"></i></div></div></div>
        <div class="mapgrid">${TONE_GRID.map(([k, c, r, sp]) => `<button class="mcell" type="button" data-mt="${k}" style="grid-column:${c};grid-row:${r} / span ${sp}"><b>${k}</b><small>${TONES[k].jp}</small></button>`).join("")}</div>`;
      A.n = 0;
      setRule("この色のトーンはどこ？", "縦＝明度（上が明るい）・横＝彩度（右が鮮やか）");
      this.next(A);
    },
    hud: A => ["LEVEL", A.n],
    extra: A => `レベル ${A.n}`,
    next(A) {
      A.n++;
      let t; do { t = pick(TONE_KEYS); } while (t === A.cur?.t);
      A.cur = { h: rnd(24) + 1, t };
      A.cur.hex = toneColor(t, A.cur.h);
      A.limit = Math.max(1.8, 5 - A.n * .12); A.left = A.limit; A.wait = 0;
      field.querySelectorAll(".mcell").forEach(b => { b.className = "mcell"; b.style.background = ""; b.style.color = ""; });
      $("#m-target").style.background = A.cur.hex;
      $("#m-info").textContent = `Lv.${A.n}　この色のトーンはどこ？`;
    },
    reveal(A) {
      const cell = field.querySelector(`[data-mt="${A.cur.t}"]`);
      cell.classList.add("reveal"); cell.style.background = A.cur.hex; cell.style.color = textOn(A.cur.hex);
      $("#m-info").innerHTML = `正解は <b>${toneLabel(A.cur.t)}</b>`;
      return cell;
    },
    update(A, dt) {
      if (A.wait > 0) { A.wait -= dt; if (A.wait <= 0) this.next(A); return; }
      A.left -= dt;
      const bar = $("#m-bar"), f = Math.max(0, A.left / A.limit);
      bar.style.width = f * 100 + "%"; bar.classList.toggle("low", f < .3);
      if (A.left <= 0) {
        const [x, y] = centerOf(this.reveal(A));
        A.wait = 1.1;
        bad(x, y, "TIME UP", { hex: A.cur.hex, text: `${A.cur.t}${A.cur.h} は ${toneLabel(A.cur.t)}（時間切れ）`, why: TONES[A.cur.t].kind });
      }
    },
    tap(A, e) {
      const b = e.target.closest("[data-mt]"); if (!b || A.wait > 0) return;
      const k = b.dataset.mt, [x, y] = centerOf(b);
      if (k === A.cur.t) {
        b.style.background = A.cur.hex; b.style.color = textOn(A.cur.hex);
        A.wait = .35;
        good(x, y, A.cur.hex, `${A.cur.t}${A.cur.h}`, 10 + Math.round(A.left / A.limit * 20));
      } else {
        b.classList.add("wrongc"); this.reveal(A); A.wait = 1.2;
        bad(x, y, `× ${k}`, { hex: A.cur.hex, text: `${A.cur.t}${A.cur.h} は ${toneLabel(A.cur.t)}。${k} を選んだ`, why: TONES[A.cur.t].kind });
      }
    },
  },

  /* ---- 色相環スナイプ ---- */
  wheel: {
    setup(A) {
      const cx = 170, cy = 170, R = 160, r = 98;
      const segs = HUES.slice(1).map((h, i) => {
        const a0 = (i - .5) / 24 * Math.PI * 2 - Math.PI / 2, a1 = (i + .5) / 24 * Math.PI * 2 - Math.PI / 2, am = (a0 + a1) / 2;
        const p = (rad, a) => `${(cx + rad * Math.cos(a)).toFixed(1)},${(cy + rad * Math.sin(a)).toFixed(1)}`;
        return `<path class="seg" data-h="${h.n}" d="M${p(r, a0)} L${p(R, a0)} A${R},${R} 0 0 1 ${p(R, a1)} L${p(r, a1)} A${r},${r} 0 0 0 ${p(r, a0)}Z" fill="${h.hex}"/>
          <text x="${(cx + (R - 16) * Math.cos(am)).toFixed(1)}" y="${(cy + (R - 16) * Math.sin(am) + 3.5).toFixed(1)}" text-anchor="middle" fill="${textOn(h.hex)}">${h.n}</text>`;
      }).join("");
      field.innerHTML = `<svg viewBox="0 0 340 340" id="w-svg" role="img" aria-label="回転する色相環">
        <g id="w-rot">${segs}</g>
        <circle cx="170" cy="170" r="88" fill="none" stroke="rgba(0,0,0,.25)" stroke-width="6"/>
        <circle id="w-timer" cx="170" cy="170" r="88" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" transform="rotate(-90 170 170)" stroke-dasharray="552.9" stroke-dashoffset="0"/>
        <circle id="w-target" cx="170" cy="170" r="76" fill="#808080"/>
        <text id="w-label" x="170" y="174" text-anchor="middle" style="font-size:14px"></text></svg>`;
      A.rot = 0; A.n = 0; A.dir = 1;
      this.next(A);
    },
    hud: A => ["LEVEL", A.n],
    extra: A => `レベル ${A.n}`,
    next(A) {
      A.n++;
      if (A.n % 4 === 0) A.dir *= -1;
      A.spd = (16 + A.n * 2.8) * A.dir;
      const h = rnd(24) + 1;
      A.kind = A.n <= 2 ? "hue" : pick(["hue", "comp"]);
      A.cur = A.kind === "hue"
        ? { h, t: pick(["b", "lt", "s", "dp", "sf", "d", "dk", "p"]), ans: h }
        : { h, t: "v", ans: wrap24(h + 12) };
      A.cur.hex = toneColor(A.cur.t, A.cur.h);
      A.limit = Math.max(2.6, 7 - A.n * .18); A.left = A.limit; A.wait = 0;
      field.querySelectorAll(".seg").forEach(s => s.classList.remove("ans", "miss"));
      $("#w-target").setAttribute("fill", A.cur.hex);
      const lab = $("#w-label"); lab.textContent = A.kind === "hue" ? `${A.cur.t}?` : "v?"; lab.setAttribute("fill", textOn(A.cur.hex));
      if (A.kind === "hue") setRule("同じ色相をタップ！", "トーンが変わっても色相番号は同じ。真ん中の色の「純色」を探そう");
      else setRule("補色をタップ！", "補色＝色相環の正反対（色相番号 ±12）");
    },
    update(A, dt) {
      A.rot = (A.rot + A.spd * dt) % 360;
      $("#w-rot").setAttribute("transform", `rotate(${A.rot.toFixed(2)} 170 170)`);
      if (A.wait > 0) { A.wait -= dt; if (A.wait <= 0) this.next(A); return; }
      A.left -= dt;
      $("#w-timer").setAttribute("stroke-dashoffset", (552.9 * (1 - Math.max(0, A.left / A.limit))).toFixed(1));
      if (A.left <= 0) {
        const seg = field.querySelector(`.seg[data-h="${A.cur.ans}"]`); seg.classList.add("ans");
        const [x, y] = centerOf(seg); A.wait = 1.2;
        bad(x, y, "TIME UP", this.mistake(A, null));
      }
    },
    mistake(A, tapped) {
      const c = A.cur, you = tapped ? `。${hueLabel(tapped)} をタップした` : "（時間切れ）";
      return A.kind === "hue"
        ? { hex: c.hex, text: `${c.t}${c.h} の色相は ${hueLabel(c.h)}${you}`, why: "トーンが違っても色相番号は同じ（例：p2・dk2 はどちらも 2:R の仲間）" }
        : { hex: c.hex, text: `${hueLabel(c.h)} の補色は ${hueLabel(c.ans)}${you}`, why: "PCCSでは色相番号に12を足し引きした色が補色" };
    },
    tap(A, e) {
      if (A.wait > 0) return;
      const svg = $("#w-svg"), r = svg.getBoundingClientRect();
      const s = Math.min(r.width, r.height) / 340;
      const ox = r.left + (r.width - 340 * s) / 2, oy = r.top + (r.height - 340 * s) / 2;
      const dx = (e.clientX - ox) / s - 170, dy = (e.clientY - oy) / s - 170, d = Math.hypot(dx, dy);
      if (d < 92 || d > 175) return;
      let ang = Math.atan2(dy, dx) * 180 / Math.PI + 90 - A.rot;
      ang = ((ang % 360) + 360) % 360;
      const hue = Math.round(ang / 15) % 24 + 1, diff = hueDiff(hue, A.cur.ans);
      const ansSeg = field.querySelector(`.seg[data-h="${A.cur.ans}"]`);
      ansSeg.classList.add("ans");
      if (diff === 0) { A.wait = .45; good(e.clientX, e.clientY, HUES[hue].hex, `PERFECT ${hueLabel(hue)}`, 20 + Math.round(A.left / A.limit * 15)); }
      else if (diff === 1) { A.wait = .7; good(e.clientX, e.clientY, HUES[hue].hex, `NEAR → 正解 ${A.cur.ans}`, 8); }
      else {
        field.querySelector(`.seg[data-h="${hue}"]`).classList.add("miss");
        A.wait = 1.2;
        bad(e.clientX, e.clientY, `× ${hue}`, this.mistake(A, hue));
      }
    },
  },
};
field.addEventListener("pointerdown", e => { if (A && A.running && A.def.tap) { e.preventDefault(); A.def.tap(A, e); } });
$("#act-quit").addEventListener("click", () => { stopAction(); renderHome(); show("home"); });
document.addEventListener("visibilitychange", () => {
  if (!A) return;
  if (document.hidden && A.running) { A.running = false; A.paused = true; }
  else if (!document.hidden && A.paused) { A.paused = false; countdown(resume); }
});

/* ================= events ================= */
document.addEventListener("click", e => {
  const m = e.target.closest("[data-mode]"); if (m) return start(m.dataset.mode);
  const am = e.target.closest("[data-act]"); if (am) return startAction(am.dataset.act);
  const c = e.target.closest(".choice"); if (c && !c.disabled) return answer(+c.dataset.i);
  const tab = e.target.closest(".tab"); if (tab) { learnTab = tab.dataset.tab; return renderLearn(); }
  const hb = e.target.closest("[data-hue]"); if (hb) { learnHue = +hb.dataset.hue; return renderLearn(); }
  const tb = e.target.closest("[data-tone]");
  if (tb) {
    const k = tb.dataset.tone, t = TONES[k];
    $("#tone-info").innerHTML = `${mini(toneColor(k, learnHue))} <b>${k}${learnHue}</b>　${t.en}（${t.jp}）<br>${t.kind}。表記は「トーン記号＋色相番号」で ${k}${learnHue} のように書きます。`;
  }
});
$("#next").addEventListener("click", next);
$("#quit").addEventListener("click", () => { renderHome(); show("home"); });
$("#again").addEventListener("click", () => lastKind === "act" ? startAction(lastAct) : start(S.mode));
$("#home-btn").addEventListener("click", () => { renderHome(); show("home"); });
$("#go-learn").addEventListener("click", () => { renderLearn(); show("learn"); });
$("#learn-back").addEventListener("click", () => show("home"));
const sndBtn = $("#snd-toggle");
const syncSnd = () => { sndBtn.textContent = "効果音: " + (soundOn ? "ON" : "OFF"); sndBtn.setAttribute("aria-pressed", soundOn); };
sndBtn.addEventListener("click", () => { soundOn = !soundOn; store.set("sound", soundOn); syncSnd(); });
document.addEventListener("keydown", e => {
  if ($("#quiz").hidden) return;
  if (["1", "2", "3", "4"].includes(e.key) && !S.locked) answer(+e.key - 1);
  else if ((e.key === "Enter" || e.key === " ") && S.locked && document.activeElement?.id !== "next") { e.preventDefault(); next(); }
});

// logo dot cycles through the hue circle
let dotHue = 2;
setInterval(() => { dotHue = wrap24(dotHue + 3); const d = $("#logo-dot"); if (d) d.style.background = HUES[dotHue].hex; }, 1600);

renderStrips(); renderHome(); syncSnd();
})();
</script>
